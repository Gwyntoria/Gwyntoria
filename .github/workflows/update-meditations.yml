name: Update monthly article collections

on:
  schedule:
    - cron: "0 10 1 * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-readme
  queue: max

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Update README
        run: |
          python scripts/update_recent.py pointless-poetry
          python scripts/update_recent.py meditations

      - name: Commit README when changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update monthly article collections"
          git push
